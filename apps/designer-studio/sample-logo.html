<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>샘플 B·C·D 교표 구성 수정</title><link rel="stylesheet" href="sample-a-logo.css"><main><h1>샘플 B·C·D · 교표 구성 분리</h1><p>확인한 샘플 A와 같은 방식으로 교표·학교명·영문명을 구성합니다. 각 템플릿의 위치와 크기를 기준으로 수정하며 학교 연락처·배경·일정은 유지합니다.</p><p>학교명 포함 로고 전환은 사용자 편집기의 최신 Preview에서 확인할 수 있습니다. 수정 후 템플릿 에디터에서 배치를 확인하고 저장해 미리보기를 갱신해 주세요.</p><form id="login"><label>관리자 이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form><div id="actions" hidden><button id="all">B·C·D 순서대로 수정·저장</button><p><button data-sample="B">샘플 B 수정</button> <button data-sample="C">샘플 C 수정</button> <button data-sample="D">샘플 D 수정</button></p></div><p id="status" role="status" aria-live="polite">관리자 로그인이 필요합니다.</p><a href="/">템플릿 에디터 열기</a></main><script src="admin-auth.js"></script><script src="sample-logo.js"></script></html>
