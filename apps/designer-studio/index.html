<style id="fixed-editor-canvas-v1">
/* The editor page is a fixed print-layout surface. Only this outer viewport scales. */
.workspace>.center .canvas-wrap{justify-content:flex-start}
.editor-page-viewport{position:relative;flex:0 0 auto;margin-inline:auto;transform:none}
.editor-page-viewport>.page{position:absolute!important;left:0!important;top:0!important;max-width:none!important;transform-origin:top left!important}
</style>
<script id="editor-page-auto-fit-runtime">
(()=>{
 const page=()=>document.getElementById('page'),viewport=()=>document.getElementById('editorPageViewport'),canvas=()=>document.querySelector('.workspace>.center .canvas-wrap');
 let frame=0;
 function fitEditorPageToViewport(){
  frame=0;
  const node=page(),frameNode=viewport(),host=canvas(),size=typeof project!=='undefined'?project?.productType?.pageSize:null;
  if(!node||!frameNode||!host||!size||document.body.classList.contains('review-pdf-printing'))return;
  const width=Number(size.width),height=Number(size.height);
  if(!(width>0&&height>0)||host.clientWidth<1||host.clientHeight<1)return;
  const style=getComputedStyle(host),horizontalPadding=parseFloat(style.paddingLeft||0)+parseFloat(style.paddingRight||0),verticalPadding=parseFloat(style.paddingTop||0)+parseFloat(style.paddingBottom||0);
  const availableWidth=Math.max(240,host.clientWidth-horizontalPadding-12),availableHeight=Math.max(240,host.clientHeight-verticalPadding-12),fit=window.ACDLEditorCanvasFit.fixedCanvasViewport({pageWidth:width,pageHeight:height,availableWidth,availableHeight});
  node.style.width=`${fit.designWidth}px`;node.style.height=`${fit.designHeight}px`;node.style.transform=`scale(${fit.scale})`;
  frameNode.style.width=`${fit.displayWidth}px`;frameNode.style.height=`${fit.displayHeight}px`;
  frameNode.dataset.canvasScale=fit.scale.toFixed(4);frameNode.dataset.designWidth=String(fit.designWidth);frameNode.dataset.designHeight=fit.designHeight.toFixed(4);
  node.dataset.fitAxis=fit.fitAxis;
 }
 function scheduleFit(){if(frame)cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>requestAnimationFrame(fitEditorPageToViewport))}
 const priorRenderPage=window.renderPage;
 if(typeof priorRenderPage==='function')window.renderPage=function(){const result=priorRenderPage.apply(this,arguments);scheduleFit();return result};
 const host=canvas();
 if(host&&'ResizeObserver'in window)new ResizeObserver(scheduleFit).observe(host);
 window.addEventListener('resize',scheduleFit,{passive:true});
 window.visualViewport?.addEventListener('resize',scheduleFit,{passive:true});
 window.ACDLEditorPageFit=Object.freeze({fit:fitEditorPageToViewport,schedule:scheduleFit,designSize:()=>{const node=viewport();return node?{width:Number(node.dataset.designWidth),height:Number(node.dataset.designHeight),scale:Number(node.dataset.canvasScale)}:null}});
 scheduleFit();
})();
</script>
<script id="review-pdf-export-runtime">
(()=>{
 const $=id=>document.getElementById(id);
 const nextFrame=()=>new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
 const safeFilePart=value=>String(value||'template').trim().replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,'-').slice(0,80)||'template';
 function waitForImages(root){
  return Promise.all([...root.querySelectorAll('img')].map(image=>image.complete?Promise.resolve():new Promise(resolve=>{image.addEventListener('load',resolve,{once:true});image.addEventListener('error',resolve,{once:true})})));
 }
 async function exportReviewPdf(){
  const pages=window.ACDLPreviewState?.pages(project)||[];
  if(!pages.length){showEditorToast('검토용 PDF로 저장할 페이지가 없습니다.');return}
  const size=project?.productType?.pageSize||{};
  const width=Number(size.width),height=Number(size.height);
  if(!(width>0&&height>0)){showEditorToast('페이지 규격을 확인할 수 없습니다.');return}
  const button=$('reviewPdfBtn');if(button)button.disabled=true;
  $('templateMenuDropdown')?.classList.add('hidden');
  showEditorToast(`${pages.length}면 검토용 PDF를 준비하고 있습니다.`);
  const saved=window.ACDLPreviewState.capture({pageId:selectedPageId,elementId:selectedElementId,scope:selectedElementScope,calendarEditing,preview,previewType});
  const root=document.createElement('main');root.className='review-pdf-root';root.setAttribute('aria-hidden','true');
  let failed=null;
  try{
   selectedElementId=null;selectedElementScope=null;calendarEditing=false;preview=false;previewType=null;
   for(const pageInfo of pages){
    selectedPageId=pageInfo.id;renderPage();applyThemeTokens();
    const live=$('page');if(!live)throw new Error(`${roleLabel(pageInfo)} 렌더링 결과가 없습니다.`);
    const clone=window.ACDLPreviewState.clonePage(live,pageInfo);
    clone.classList.remove('editor-bleed-visible','export-crop-marks','export-guides-visible');clone.classList.add('review-pdf-page');clone.style.width='100%';clone.style.height='100%';
    const sheet=document.createElement('section');sheet.className='review-pdf-sheet';sheet.dataset.pageId=pageInfo.id;sheet.setAttribute('aria-label',roleLabel(pageInfo));sheet.style.width=`${width}mm`;sheet.style.height=`${height}mm`;sheet.appendChild(clone);root.appendChild(sheet);
   }
  }catch(error){failed=error;console.error('review PDF render failed',error)}
  const restored=window.ACDLPreviewState.restore(project,saved);selectedPageId=restored.pageId;selectedElementId=restored.elementId;selectedElementScope=restored.scope;calendarEditing=restored.calendarEditing;preview=restored.preview;previewType=restored.previewType;
  try{render()}catch(error){console.error('editor restore failed',error)}
  if(failed){if(button)button.disabled=false;showEditorToast(`검토용 PDF를 만들지 못했습니다: ${failed.message||failed}`);return}
  const pageStyle=document.createElement('style');pageStyle.id='reviewPdfPageStyle';pageStyle.textContent=`@page{size:${width}mm ${height}mm;margin:0}`;document.head.appendChild(pageStyle);document.body.appendChild(root);
  const originalTitle=document.title;
  const metadata=project?.template?.metadata||{};document.title=`${safeFilePart(metadata.name||project?.book?.id)}-review-${safeFilePart(metadata.version||'draft')}`;
  const cleanup=()=>{document.body.classList.remove('review-pdf-printing');root.remove();pageStyle.remove();document.title=originalTitle;if(button)button.disabled=false};
  try{
   if(document.fonts?.ready)await document.fonts.ready;await waitForImages(root);await nextFrame();
   document.body.classList.add('review-pdf-printing');await nextFrame();
   showEditorToast('인쇄 화면에서 대상을 “PDF로 저장”으로 선택하세요. 이 파일은 검토용이며 인쇄 원고가 아닙니다.');
   window.print();
  }finally{setTimeout(cleanup,0)}
 }
 $('reviewPdfBtn')?.addEventListener('click',event=>{event.preventDefault();event.stopImmediatePropagation();exportReviewPdf()},true);
 window.ACDLReviewPdf=Object.freeze({export:exportReviewPdf});
})();
</script>
<script id="admin-landing-runtime">
(()=>{
 const $=id=>document.getElementById(id),auth=window.ACDLAdminAuth;
 if(!auth)return;
 let pendingAction=null;
 const modal=$('adminAuthModal'),form=$('adminAuthForm'),error=$('adminAuthError'),submit=$('submitAdminAuthBtn');
 function updateAuthView(){const user=auth.currentUser(),signed=auth.isSignedIn();$('landingSignInBtn').textContent=signed?'Sign Out':'Sign In';$('landingAdminUser').textContent=signed?`${user.email} · Master Admin`:'Master Admin 전용';$('adminSessionBtn').textContent=signed?`${user.email} · Sign Out`:'Sign In';document.body.dataset.adminAuthenticated=signed?'true':'false'}
 function openSignIn(action=null){pendingAction=action;error.textContent='';form.reset();modal.classList.remove('hidden');requestAnimationFrame(()=>$('adminAuthEmail').focus())}
 function closeSignIn(){modal.classList.add('hidden');pendingAction=null}
 document.addEventListener('click',event=>{const button=event.target.closest('#designerHomeLibrary,#designerHomeNew,#designerHomeTypes');if(!button||auth.isSignedIn())return;event.preventDefault();event.stopImmediatePropagation();openSignIn(()=>button.click())},true);
 $('landingSignInBtn').addEventListener('click',()=>{if(auth.isSignedIn()){auth.signOut();showEntry();updateAuthView()}else openSignIn()});
 $('adminSessionBtn').addEventListener('click',()=>{if(auth.isSignedIn()){auth.signOut();showEntry();updateAuthView()}else openSignIn()});
 $('closeAdminAuthBtn').addEventListener('click',closeSignIn);
 modal.addEventListener('click',event=>{if(event.target===modal)closeSignIn()});
 form.addEventListener('submit',async event=>{event.preventDefault();error.textContent='';submit.disabled=true;submit.textContent='확인 중…';try{await auth.signIn($('adminAuthEmail').value,$('adminAuthPassword').value);const next=pendingAction;modal.classList.add('hidden');pendingAction=null;updateAuthView();next?.()}catch(reason){error.textContent=reason?.message||'로그인할 수 없습니다.'}finally{submit.disabled=false;submit.textContent='Sign In'}});
 auth.onChange(updateAuthView);auth.ensureSession().finally(updateAuthView);updateAuthView();
})();
</script>
