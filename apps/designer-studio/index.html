.semantic-song .semantic-media{min-height:55%}
.semantic-role-badge{position:absolute;left:4px;top:4px;background:rgba(28,40,58,.76);color:white;border-radius:4px;padding:2px 5px;font-size:8px;pointer-events:none;z-index:8}
.content-lock{cursor:default}
.mode-notice{padding:8px;border-radius:7px;background:#f3f6fa;color:#596579;font-size:10px;line-height:1.45;margin-bottom:8px}
.field-note{font-size:10px;color:var(--muted);margin:-3px 0 8px}
.semantic-parts{border-top:1px solid #edf0f4;margin-top:8px;padding-top:8px}
.badge-common{display:inline-block;background:#eaf2ff;color:#245aa5;border-radius:999px;padding:3px 7px;font-size:9px;margin-left:4px}
.preview-only .semantic-role-badge{display:none!important}
@media(max-width:720px){.object-grid{grid-template-columns:1fr}}

.semantic-image-preview{width:100%;aspect-ratio:16/9;border:1px solid var(--line);border-radius:8px;background:#f2f4f7;display:flex;align-items:center;justify-content:center;overflow:hidden;margin:5px 0 8px;color:var(--muted);font-size:10px}
.semantic-image-preview img{width:100%;height:100%;object-fit:contain}
.edit-lock-card{border:1px solid #cbd7e8;background:#f6f9fd;border-radius:9px;padding:10px;margin:8px 0}
.edit-lock-card strong{display:block;font-size:11px;margin-bottom:4px}
.edit-lock-card p{margin:0 0 8px;font-size:10px;color:var(--muted);line-height:1.45}
.status-pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:4px 8px;font-size:9px;margin-bottom:7px;background:#eef2f6;color:#4b5565}
.status-pill.editable{background:#eaf4ff;color:#245b9e}
.editor-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(12px);z-index:100;background:#202938;color:white;border-radius:9px;padding:10px 14px;font-size:11px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;pointer-events:none;transition:.18s ease;max-width:min(440px,90vw);text-align:center}
.editor-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.free-element.content-lock{cursor:not-allowed}
.free-element.active .elem-handle{display:block}
.preview-only .editor-toast{display:none!important}

.day-stack{display:flex;flex-direction:column;gap:2px;min-height:0}
.day-block{min-height:0}
.day-block.compact-extra{border-top:1px dashed rgba(110,120,135,.45);padding-top:2px;margin-top:1px}
.day-block.compact-extra .day{font-size:9px}
.day-block.compact-extra .event{font-size:7px;line-height:1.15}
.compact-pair{background:rgba(246,248,251,.65)}
.master-apply-card{border:1px solid #b8cbe4;background:#f5f9ff;border-radius:9px;padding:10px;margin:8px 0}
.master-apply-card strong{display:block;font-size:11px;margin-bottom:4px}
.master-apply-card p{font-size:10px;color:var(--muted);line-height:1.45;margin:0 0 8px}
.master-scope-note{font-size:9px;color:#245b9e;margin-top:5px}

.template-designer-badge button{pointer-events:none}
.inspector-group{border:1px solid var(--line);border-radius:9px;padding:10px;margin:9px 0;background:#fff}
.inspector-group-title{display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:800;margin-bottom:8px}
.inspector-group-title small{font-size:8px;font-weight:600;color:var(--muted)}
.binding-path{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:9px;background:#f4f6f9;border:1px solid var(--line);border-radius:6px;padding:7px;word-break:break-all;color:#3d526c;margin-top:5px}
.sample-badge{display:inline-flex;border-radius:999px;padding:3px 7px;background:#fff4db;color:#8a5d00;font-size:8px;font-weight:800}
.binding-badge{display:inline-flex;border-radius:999px;padding:3px 7px;background:#e9f4ff;color:#185a9d;font-size:8px;font-weight:800}
.fixed-badge{display:inline-flex;border-radius:999px;padding:3px 7px;background:#f0f1f3;color:#505865;font-size:8px;font-weight:800}
.template-help-card{border:1px solid #bad0ea;background:#f5f9ff;border-radius:9px;padding:9px;font-size:9px;line-height:1.5;color:#41566f;margin:7px 0}
.inline-check{display:flex!important;align-items:flex-start;gap:7px}
.inline-check input{width:auto!important;height:auto!important;margin-top:2px}
.semantic-role-badge.binding-off{background:#555}

.calendar-region{transition:outline-color .15s,box-shadow .15s}
.calendar-region:not(.editing) .month-title{cursor:pointer}
.calendar-region:not(.editing) .month-title:hover{outline:1px dashed rgba(34,102,170,.55);outline-offset:3px}
.calendar-region.editing{outline:2px solid #2f76c2!important;outline-offset:2px;box-shadow:0 0 0 4px rgba(47,118,194,.12)}
.calendar-drag-bar{position:absolute;left:50%;top:-18px;transform:translateX(-50%);z-index:20;background:#2f76c2;color:#fff;border-radius:999px;padding:3px 10px;font-size:8px;font-weight:800;cursor:move;white-space:nowrap}
.calendar-handle.n{top:-7px;left:50%;transform:translateX(-50%);cursor:ns-resize}
.calendar-handle.w{left:-7px;top:50%;transform:translateY(-50%);cursor:ew-resize}
.calendar-handle.nw{left:-7px;top:-7px;cursor:nwse-resize}
.calendar-handle.ne{right:-7px;top:-7px;cursor:nesw-resize}
.calendar-handle.sw{left:-7px;bottom:-7px;cursor:nesw-resize}
.calendar-size-presets{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:7px}
.calendar-size-presets button{font-size:9px;padding:7px 5px}
.calendar-master-note{font-size:9px;color:#245b9e;background:#f3f8ff;border-radius:7px;padding:7px;line-height:1.45;margin:7px 0}

.calendar-stage{position:relative;flex:1;min-height:0}
.calendar-stage .calendar{height:100%}
.range-event-layer{position:absolute;left:0;right:0;top:21px;bottom:0;pointer-events:none;z-index:8}
.range-event-bar{position:absolute;box-sizing:border-box;border-radius:4px;background:var(--accent);color:#fff;font-size:7px;font-weight:700;line-height:1;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 4px;opacity:.92}
.range-event-bar.continues-before{border-top-left-radius:0;border-bottom-left-radius:0;padding-left:7px}
.range-event-bar.continues-after{border-top-right-radius:0;border-bottom-right-radius:0;padding-right:8px}
.range-event-bar.continues-before::before{content:"‹";position:absolute;left:2px;font-size:9px}
.range-event-bar.continues-after::after{content:"›";position:absolute;right:2px;font-size:9px}
.range-event-bar.label-above{overflow:visible;background:transparent;color:var(--text);border-bottom:3px solid var(--accent);border-radius:0;align-items:flex-start;padding:0 2px}
.range-event-overflow{position:absolute;right:2px;font-size:7px;font-weight:800;color:var(--muted);background:rgba(255,255,255,.86);padding:1px 3px;border-radius:3px}
.range-event-legend{font-size:9px;color:var(--muted);line-height:1.45;background:#f6f8fb;border:1px solid var(--line);border-radius:7px;padding:7px;margin-bottom:8px}
.range-style-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.range-style-preview{position:relative;height:55px;border:1px solid var(--line);border-radius:7px;background:repeating-linear-gradient(to right,transparent 0,transparent calc(14.285% - 1px),#e7ebf0 calc(14.285% - 1px),#e7ebf0 14.285%);overflow:hidden;margin:6px 0 9px}
.range-style-preview .demo-bar{position:absolute;left:14.285%;width:57.14%;top:14px;height:12px;border-radius:4px;background:var(--accent);color:#fff;font-size:8px;padding:2px 5px;white-space:nowrap;overflow:hidden}

.template-surface-guide{position:absolute;inset:0;border:2px dashed #b7c5d8;border-radius:11px;background:
 linear-gradient(rgba(246,249,253,.92),rgba(246,249,253,.92)),
 repeating-linear-gradient(0deg,transparent 0 23px,#e9eef5 23px 24px),
 repeating-linear-gradient(90deg,transparent 0 23px,#e9eef5 23px 24px);
 display:flex;align-items:center;justify-content:center;text-align:center;color:#64748b;pointer-events:none;z-index:0}
.template-surface-guide-inner{max-width:66%;padding:18px}
.template-surface-guide .guide-kicker{display:inline-block;font-size:8px;font-weight:800;letter-spacing:.08em;padding:3px 7px;border-radius:999px;background:#e6effa;color:#285d96;margin-bottom:8px}
.template-surface-guide strong{display:block;font-size:18px;color:#334155;margin-bottom:6px}
.template-surface-guide p{font-size:10px;line-height:1.55;margin:0}
.template
