<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>학사달력 v1.1 시각 비교</title>
<link rel="stylesheet" href="./desk-academic-shadow-renderer.css">
<script src="./calendar-domain-bridge.js"></script><script src="./desk-academic-shadow-renderer.js"></script><script src="./desk-academic-visual-parity.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#e9edf3;color:#172033;font-family:Pretendard,"Noto Sans KR",Arial,sans-serif}header{position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid #d7dde7;background:#fff}header h1{margin:0;font-size:17px}header p{margin:4px 0 0;color:#64748b;font-size:11px}.status{border-radius:999px;background:#eaf7ef;padding:7px 11px;color:#087443;font-size:11px;font-weight:800}main{display:grid;gap:28px;padding:28px}.case{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:start}.case aside{position:sticky;top:92px;border:1px solid #d7dde7;border-radius:10px;background:#fff;padding:14px}.case h2{margin:0 0 8px;font-size:14px}.case ul{margin:0;padding-left:17px;color:#475569;font-size:11px;line-height:1.8}.stage{overflow:auto;border-radius:12px;background:#d9dee7;padding:22px}.stage .shadow-package-page{margin:auto;box-shadow:0 12px 38px rgba(15,23,42,.18);transform-origin:top left}.note{margin-top:8px;color:#64748b;font-size:10px}@media(max-width:800px){.case{grid-template-columns:1fr}.case aside{position:static}}
</style></head><body>
<header><div><h1>학사달력 에디터 서비스 v1.1 시각 비교</h1><p>사용자 UI를 교체하지 않는 독립 QA 화면 · 기준: integration/runtime-v2</p></div><span class="status" id="status">구조 검사 중</span></header>
<main id="cases"></main>
<script>
const size={width:266,height:186,unit:'mm'}, frame=(x,y,width,height)=>({x,y,width,height});
const sampleImage=`data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700"><defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#b9d8f3"/><stop offset="1" stop-color="#edf4df"/></linearGradient></defs><rect width="1200" height="700" fill="url(#sky)"/><circle cx="1010" cy="115" r="70" fill="#fff4b8"/><path d="M0 520L260 350l220 150 250-230 470 300v130H0z" fill="#7ba37d"/><rect x="260" y="340" width="680" height="270" rx="8" fill="#f7f3ea"/><rect x="310" y="390" width="120" height="90" fill="#82a8c9"/><rect x="470" y="390" width="120" height="90" fill="#82a8c9"/><rect x="630" y="390" width="120" height="90" fill="#82a8c9"/><rect x="790" y="390" width="100" height="220" fill="#5f7184"/><text x="600" y="570" text-anchor="middle" font-family="Arial" font-size="46" font-weight="700" fill="#315e9e">SCHOOL CALENDAR</text></svg>')}`;
const pages=[
 {id:'visual.calendar.2027-05',role:'monthly-calendar',size,objects:[{id:'calendar',type:'calendar',frame:frame(13,18,240,150),payload:{year:2027,month:5,gridRows:5},visible:true,zIndex:1}]},
 {id:'visual.photo-memo.2027-03',role:'monthly-photo-memo',size,objects:[{id:'photo-memo',type:'composite-master',frame:frame(0,0,266,186),visible:true,zIndex:1,contract:{children:[{id:'monthly-photo',payload:sampleImage},{id:'monthly-memo',lineCount:7,drawnLineCount:6,footer:{leftBinding:'성실 · 창의 · 협력',rightBinding:'school.example'}}]}}]},
 {id:'visual.back-contact',role:'back-contact',size,objects:[{id:'back.badge',type:'semantic-object',role:'school-badge',frame:frame(15.96,55.8,85.12,18.6),payload:'지란중학교',visible:true,zIndex:2},{id:'back.photo',type:'image-frame',role:'end-photo',frame:frame(127.68,25.11,125.29,102.49),payload:sampleImage,visible:true,zIndex:1},{id:'back.contact-card',type:'contact-card',role:'school-contact',frame:frame(13.03,138.01,239.93,34.97),payload:{address:'서울특별시 강남구 학사로 123',academicPhone:'02-1234-5678',adminPhone:'02-1234-5679',fax:'02-1234-5680',site:'school.example'},metadata:{hideWhenAllEmpty:true},visible:true,zIndex:2}]}
];
const rendered={pageCount:28,pages:[]};
for(let i=0;i<12;i++)rendered.pages.push({role:'monthly-calendar',html:ACDLDeskAcademicShadowRenderer.renderPage({...pages[0],id:`calendar.${i}`})});
for(let i=0;i<12;i++)rendered.pages.push({role:'monthly-photo-memo',html:ACDLDeskAcademicShadowRenderer.renderPage({...pages[1],id:`photo.${i}`})});
rendered.pages.push(...Array.from({length:3},()=>({role:'support',html:''})),{role:'back-contact',html:ACDLDeskAcademicShadowRenderer.renderPage(pages[2])});
const report=ACDLDeskAcademicVisualParity.compare(rendered);document.getElementById('status').textContent=report.structurallyReady?'구조 기준 통과 · 육안 승인 전':`${report.issues.length}개 구조 차이`;
const specs={
 'monthly-calendar':['5행×7열, 총 35칸','2027년 5월의 30·31일 병기','일요일 빨강·토요일 파랑'],
 'monthly-photo-memo':['안전영역 안 사진 1.7 : 메모 1','메모 7칸·DOM 구분선 6개','빈 사진 안내는 화면 전용'],
 'back-contact':['끝지 사진 독립 슬롯·표지 사진 폴백','주소와 값 있는 연락처만 표시','연락처 전체가 비면 카드 숨김']
};
const labels={'monthly-calendar':'대표 월력','monthly-photo-memo':'사진 + 메모','back-contact':'끝지 연락처'};
const root=document.getElementById('cases');pages.forEach(page=>{const section=document.createElement('section');section.className='case';section.innerHTML=`<aside><h2>${labels[page.role]}</h2><ul>${specs[page.role].map(x=>`<li>${x}</li>`).join('')}</ul><p class="note">이 화면은 구조·비율 확인용이며 실제 v1.1 화면과의 육안 승인 및 PDF 비교는 아직 남아 있습니다.</p></aside><div class="stage">${ACDLDeskAcademicShadowRenderer.renderPage(page)}</div>`;root.appendChild(section)});
</script></body></html>
