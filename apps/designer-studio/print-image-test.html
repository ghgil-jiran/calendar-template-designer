<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>표지 고해상도 편집 시험</title><style>body{font:16px system-ui;background:#f3f5f9;color:#17253c;max-width:1100px;margin:32px auto;padding:20px}section{background:white;border:1px solid #dbe1eb;border-radius:14px;padding:24px;margin:18px 0}button,a{padding:12px 18px}button{cursor:pointer}input{padding:10px}img{max-width:100%;display:block;margin-top:18px}#status{white-space:pre-wrap}label{display:block;margin:10px 0}a{display:inline-block}</style><h1>표지 고해상도 편집 시험</h1><p>원본을 참조해 3168 × 2208px로 편집합니다. 유료 API를 한 번 호출하며, 원본과 세부 표현이 달라질 수 있습니다.</p><section id="login"><p id="session">로그인 확인 중…</p><button id="testLogin" hidden>Preview 테스트 로그인</button><form id="loginForm" hidden><label>이메일 <input id="email" type="email" autocomplete="username" required></label><label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form></section><section><label>원본 PNG 선택 (4MB 이하)<input id="file" type="file" accept="image/png"></label><button id="run" disabled>고해상도 표지 1장 편집</button><p id="status" role="status"></p><div id="result"></div></section><script src="admin-auth.js"></script><script type="module" src="print-image-test.js"></script></html>
