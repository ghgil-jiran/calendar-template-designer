<!doctype html><html lang="ko"><meta charset="utf-8"><title>샘플 A v3 수정본 관리</title><main style="max-width:900px;margin:40px auto;font:15px/1.6 sans-serif"><h1>샘플 A · v3 기준 수정본</h1><p>원본 배경·패키지 연결을 보존하고 새 편집 버전으로 저장합니다.</p><form id="login"><label>이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form><section id="work" hidden><button id="inspect">v3 원본 확인</button><button id="download" disabled>원본 문서 내려받기</button><pre id="summary" style="white-space:pre-wrap;max-height:450px;overflow:auto"></pre><label>수정본 JSON<input id="file" type="file" accept=".json,application/json"></label><button id="save" disabled>확인한 수정본을 새 초안 버전으로 저장</button></section><pre id="status" role="status"></pre><a href="/">템플릿 에디터 열기</a></main><script src="admin-auth.js"></script><script src="sample-a-v3-revision.js"></script></html>
