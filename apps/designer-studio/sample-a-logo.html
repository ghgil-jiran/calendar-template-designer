<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>샘플 A 교표 구성 수정</title><link rel="stylesheet" href="../../design-system/09-css-tokens.css"><link rel="stylesheet" href="sample-a-logo.css"><main><h1>샘플 A · 교표 구성 분리</h1><p>표지·월력 앞면 12면·뒷표지에 교표 이미지, 학교명, 영문명 글틀을 구성합니다. 기존 배경·학교 정보·페이지 순서는 유지합니다.</p><p>이전 버전은 보존하고 현재 샘플 A의 새 버전으로 저장합니다. 저장 후 에디터에서 배치 확인과 미리보기 갱신이 필요합니다.</p><form id="login"><label>관리자 이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button>로그인</button></form><button id="apply" hidden>샘플 A 교표 구성 수정·저장</button><p id="status" role="status" aria-live="polite">관리자 로그인이 필요합니다.</p><a href="/">템플릿 에디터 열기</a></main><script src="admin-auth.js"></script><script src="sample-a-logo.js"></script></html>
