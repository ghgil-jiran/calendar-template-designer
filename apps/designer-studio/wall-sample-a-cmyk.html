<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>샘플 A CMYK 배경 반영</title><style>body{margin:0;background:#f4f6f8;font:16px/1.7 system-ui,sans-serif;color:#202b38}main{max-width:640px;margin:60px auto;padding:32px;background:white;border-radius:18px;box-shadow:0 8px 36px #20304010}h1{font-size:26px;line-height:1.4}label{display:block;margin:16px 0}input{display:block;box-sizing:border-box;width:100%;padding:12px;border:1px solid #abb5c0;border-radius:8px;font:inherit}button,a{font:inherit}button{padding:12px 20px;border:0;border-radius:8px;background:#1868d5;color:white;cursor:pointer}button:disabled{opacity:.45;cursor:default}#status{white-space:pre-wrap;padding:16px;background:#f1f5fa;border-radius:8px}small{color:#5e6c7b}a{color:#1868d5}@media(max-width:720px){main{margin:20px;padding:24px}}</style><main><small>벽보형 · 플라워 1면형</small><h1>샘플 A CMYK 배경 반영</h1><p>기존 학교 정보·일정·개체 배치를 유지하면서 배경 PDF를 CMYK 원본으로 교체하고 새 초안 버전으로 저장합니다.</p><p>배경 파일은 서버에 준비되어 있습니다. 관리자 로그인 후 등록을 실행해 주세요.</p><form id="login"><label>관리자 이메일<input id="email" type="email" autocomplete="username" required></label><label>비밀번호<input id="password" type="password" autocomplete="current-password" required></label><button id="signIn">관리자 로그인</button></form><p id="account"></p><button id="apply" disabled>원본 등록 및 수정본 저장</button><p id="status" role="status" aria-live="polite">관리자 로그인이 필요합니다.</p><p><a href="/" target="_blank" rel="noopener">템플릿 에디터 열기</a></p><small>저장 후 에디터에서 확인하고 새 인쇄 품질 검사를 진행해 주세요. 실제 Worker 출력 검증은 별도입니다.</small></main><script src="admin-auth.js"></script><script src="wall-sample-a-cmyk-ui.js"></script></html>
