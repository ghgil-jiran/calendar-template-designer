<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sprint 2 Editor Core Demo</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header>
    <div><strong>Calendar Template Designer</strong><span>Sprint 2 · Editor Core 테스트</span></div>
    <div class="toolbar">
      <button id="undo">실행 취소</button><button id="redo">다시 실행</button>
      <button id="front">맨 앞으로</button><button id="back">맨 뒤로</button>
      <button id="lock">잠금/해제</button><button id="hide">숨김/표시</button>
      <button id="delete">삭제</button><button id="reset">초기화</button>
    </div>
  </header>
  <main>
    <aside>
      <h2>테스트 방법</h2>
      <ol><li>개체를 클릭해 선택합니다.</li><li>Shift+클릭으로 다중 선택합니다.</li><li>선택한 개체를 드래그해 이동합니다.</li><li>오른쪽 아래 핸들로 크기를 조절합니다.</li><li>상단 원형 핸들로 회전합니다.</li><li>실행 취소와 다시 실행을 확인합니다.</li></ol>
      <label><input id="snap" type="checkbox" checked /> 10px 그리드 스냅</label>
      <label><input id="objectSnap" type="checkbox" checked /> 개체/중앙 스냅</label>
      <section id="status"></section>
    </aside>
    <section class="workspace"><div id="canvas" aria-label="Editor canvas"></div></section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
